<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I AM — 이승섭</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#F3EDE2', card: '#ECE3D2',
          ink: '#37291D', 'ink-soft': '#6C5945', 'ink-faint': '#9C8C74',
          line: 'rgba(55,41,29,0.10)',
          book: '#4A6B4F', music: '#B08328', body: '#B65A38', shelf: '#8A6B4A',
        },
        fontFamily: {
          serif: ['"Gowun Batang"', 'serif'],
          sans: ['Pretendard', '-apple-system', 'sans-serif'],
        },
      },
    },
  };
</script>
</head>

<body class="bg-bg text-ink font-sans antialiased leading-relaxed">

  <!-- ===== 네비게이션 바 (모든 페이지에 동일하게 삽입) ===== -->
  <nav class="sticky top-0 z-40 bg-bg/85 backdrop-blur border-b border-line">
    <div class="max-w-3xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="index.html" class="font-serif font-bold text-lg tracking-tight">이승섭</a>
      <div class="flex items-center gap-6 text-sm">
        <a href="index.html"     data-nav class="relative py-1 text-ink-soft hover:text-ink transition-colors">홈</a>
        <a href="about.html"     data-nav class="relative py-1 text-ink-soft hover:text-ink transition-colors">소개</a>
        <a href="bookshelf.html" data-nav class="relative py-1 text-ink-soft hover:text-ink transition-colors">책장</a>
      </div>
    </div>
  </nav>
  <script>
    // 현재 열려 있는 페이지에 맞춰 네비게이션 밑줄을 자동으로 표시합니다.
    (function () {
      const current = location.pathname.split('/').pop() || 'index.html';
      const underline = {
        'index.html': 'bg-ink',
        'about.html': 'bg-gradient-to-r from-book via-music to-body',
        'bookshelf.html': 'bg-book',
      };
      document.querySelectorAll('a[data-nav]').forEach(function (link) {
        if (link.getAttribute('href') === current) {
          link.classList.remove('text-ink-soft', 'hover:text-ink');
          link.classList.add('text-ink');
          link.setAttribute('aria-current', 'page');
          const bar = document.createElement('span');
          bar.className = 'absolute left-0 -bottom-0.5 h-[2px] w-full ' + (underline[current] || 'bg-ink');
          link.appendChild(bar);
        }
      });
    })();
  </script>

  <!-- ===== HERO ===== -->
  <section class="px-6 pt-24 pb-8 text-center">
    <p class="text-[13px] tracking-[0.3em] text-ink-faint uppercase mb-6">I AM</p>
    <h1 class="font-serif font-bold text-[clamp(42px,7vw,62px)] leading-tight tracking-tight mb-7">이승섭</h1>
    <p class="text-[17.5px] text-ink-soft max-w-[460px] mx-auto">
      여러 갈래의 경험을 두루 겪고, 하나로 엮어가고 싶은 사람입니다.
    </p>

    <svg class="block w-[min(680px,92%)] mx-auto mt-7" viewBox="0 0 680 120"
         preserveAspectRatio="xMidYMid meet" role="img" aria-label="세 갈래의 실이 하나로 엮이는 그림">
      <path d="M 40 30 C 180 30, 240 60, 340 60 S 520 90, 640 60" fill="none" stroke="#4A6B4F" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <path d="M 40 60 C 180 60, 240 30, 340 60 S 520 30, 640 60" fill="none" stroke="#B08328" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <path d="M 40 90 C 180 90, 240 90, 340 60 S 520 60, 640 60" fill="none" stroke="#B65A38" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <circle cx="40" cy="30" r="4" fill="#4A6B4F"/>
      <circle cx="40" cy="60" r="4" fill="#B08328"/>
      <circle cx="40" cy="90" r="4" fill="#B65A38"/>
      <circle cx="640" cy="60" r="5" fill="#37291D"/>
    </svg>
  </section>

  <!-- ===== 소개로 가는 안내 ===== -->
  <section class="px-6 max-w-3xl mx-auto text-center py-6">
    <p class="text-ink-soft text-[15.5px]">
      책과 음악, 그리고 달리기까지 —
      <a href="about.html" class="text-book underline underline-offset-4 decoration-book/40 hover:decoration-book transition-colors">저를 이루는 세 갈래</a>를 소개할게요.
    </p>
  </section>

  <!-- ===== GOAL (닫는 문장) ===== -->
  <section class="px-6 pt-24 pb-28 text-center">
    <div class="max-w-[560px] mx-auto">
      <svg class="block w-[200px] mx-auto mb-8" viewBox="0 0 200 24" aria-hidden="true">
        <path d="M 10 6 C 60 6, 90 12, 190 12" fill="none" stroke="#4A6B4F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <path d="M 10 12 C 60 12, 90 12, 190 12" fill="none" stroke="#B08328" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <path d="M 10 18 C 60 18, 90 12, 190 12" fill="none" stroke="#B65A38" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      </svg>
      <p class="text-[13px] tracking-[0.26em] text-ink-faint uppercase mb-7">Goal</p>
      <blockquote class="font-serif font-bold text-[clamp(20px,3.4vw,26px)] leading-[1.7] m-0">
        다양한 일들을 많이 해보고 싶습니다.<br>
        그리고 개발을 공부할수록, 여러 경험들을<br>
        잘 엮어나갈 수 있다고 믿습니다.
      </blockquote>
      <p class="mt-8 text-sm text-ink-faint">이승섭</p>
    </div>
  </section>

  <footer class="px-6 pt-7 pb-12 text-center text-[13px] text-ink-faint border-t border-line">
    I AM — 이승섭
  </footer>

</body>
</html>
