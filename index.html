<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈 | I AM — 이승섭</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3EDE2;
    --bg-card: #ECE3D2;
    --ink: #37291D;
    --ink-soft: #6C5945;
    --ink-faint: #9C8C74;
    --line: rgba(55, 41, 29, 0.10);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, blockquote { font-family: 'Gowun Batang', serif; font-weight: 700; }

  nav {
    background: var(--bg-card);
    border-bottom: 1px solid var(--line);
  }

  nav a {
    text-decoration: none;
    color: var(--ink-soft);
    transition: color 0.2s ease;
  }

  nav a:hover {
    color: var(--ink);
  }

  nav a.active {
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 4px;
  }

  nav .logo {
    color: var(--ink);
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
  }

  .hero {
    padding: 110px 24px 60px;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(42px, 7vw, 62px);
    margin: 0 0 26px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .hero p {
    font-size: 17.5px;
    color: var(--ink-soft);
    max-width: 600px;
    margin: 0 auto;
  }

  .cta-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  .cta-btn {
    padding: 12px 32px;
    font-family: 'Pretendard', sans-serif;
    font-size: 15px;
    text-decoration: none;
    border-radius: 999px;
    transition: all 0.2s ease;
    border: 1px solid;
  }

  .cta-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .cta-btn.primary:hover {
    background: var(--ink-soft);
    border-color: var(--ink-soft);
  }

  .cta-btn.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--ink);
  }

  .cta-btn.secondary:hover {
    background: var(--ink);
    color: var(--bg);
  }

  .features {
    padding: 60px 24px;
    max-width: 900px;
    margin: 0 auto;
  }

  .features h2 {
    font-size: 28px;
    margin: 0 0 40px;
    text-align: center;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 24px;
  }

  .feature-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 28px;
    border-radius: 8px;
  }

  .feature-card h3 {
    font-size: 18px;
    margin: 0 0 12px;
  }

  .feature-card p {
    font-size: 14px;
    margin: 0;
    color: var(--ink-soft);
  }

  footer {
    padding: 28px 24px 46px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 560px) {
    .hero { padding: 80px 20px 40px; }
    .cta-buttons { flex-direction: column; align-items: center; }
    .cta-btn { width: 100%; max-width: 280px; }
  }
</style>
</head>
<body>

<nav>
  <div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;">
    <a href="index.html" class="logo">I AM</a>
    <ul style="display: flex; list-style: none; gap: 32px; margin: 0; padding: 0;">
      <li><a href="index.html" class="active">홈</a></li>
      <li><a href="intro.html">소개</a></li>
      <li><a href="contact.html">연락처</a></li>
    </ul>
  </div>
</nav>

<section class="hero">
  <h1>이승섭</h1>
  <p>여러 갈래의 경험을 두루 겪고, 하나로 엮어가고 싶은 사람입니다.</p>
  <div class="cta-buttons">
    <a href="intro.html" class="cta-btn primary">자세히 알아보기</a>
    <a href="contact.html" class="cta-btn secondary">연락하기</a>
  </div>
</section>

<section class="features">
  <h2>저는 이런 사람입니다</h2>
  <div class="feature-grid">
    <div class="feature-card">
      <h3>📚 독서</h3>
      <p>책을 통해 다양한 관점을 배웁니다. 좋은 도서가 있으면 꼭 추천해주세요.</p>
    </div>
    <div class="feature-card">
      <h3>🎹 음악</h3>
      <p>피아노를 좋아합니다. 같은 곡도 연주자에 따라 다르게 들리는 그 느낌을 좋아합니다.</p>
    </div>
    <div class="feature-card">
      <h3>🏃 운동</h3>
      <p>달리기와 축구, 헬스 등 다양한 운동을 즐깁니다. 건강한 생활을 추구합니다.</p>
    </div>
  </div>
</section>

<footer>
  I AM — 이승섭
</footer>

</body>
</html>
